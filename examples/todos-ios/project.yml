name: Todos
options:
  bundleIdPrefix: lab.reactor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGNING_ALLOWED: NO
targets:
  Todos:
    type: application
    platform: iOS
    sources:
      - Todos
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.reactor.todos
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Todos/Info.plist
      properties:
        CFBundleDisplayName: Todos
        REACTOR_URL: $(REACTOR_URL)
        REACTOR_ANON_KEY: $(REACTOR_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: Reactor
packages:
  Reactor:
    path: ../../sdks/swift
