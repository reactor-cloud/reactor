openapi: 3.0.3
info:
  title: Reactor console
  version: 1.26.11-beta2
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
  description: |
    Operator API for one Reactor cluster. Human sessions are bearer JWTs
    with audience console. This file is the contract for the mobile console.
    The project API stays in openapi.yaml.
servers:
  - url: http://127.0.0.1:18000
    description: Local cluster
tags:
  - name: console
paths:
  "/console/v1/setup":
    get:
      tags: [console]
      summary: Whether the cluster still needs its first operator
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Create the cluster name and the first platform admin
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/setup/restart":
    post:
      tags: [console]
      summary: Delete operators and the cluster name while no project exists
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/login":
    post:
      tags: [console]
      summary: Password check. Returns a session, an MFA token, or an enrollment token
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/me":
    get:
      tags: [console]
      summary: Signed-in operator, cluster name, and project memberships
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/extensions":
    get:
      tags: [console]
      summary: Loaded extensions. Queue appears when name is queue
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/keys":
    get:
      tags: [console]
      summary: List console service keys
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Mint a console service key. Token is returned once
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/keys/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: Key id
    delete:
      tags: [console]
      summary: Revoke a console service key
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/cluster":
    get:
      tags: [console]
      summary: Cluster health, place, and projects
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Rename the cluster
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/cluster/email":
    get:
      tags: [console]
      summary: Cluster SMTP settings. Password is write-only
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    put:
      tags: [console]
      summary: Replace cluster SMTP settings
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/operators":
    get:
      tags: [console]
      summary: List console operators
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Create a console operator
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/operators/{operator_id}":
    parameters:
      - name: operator_id
        in: path
        required: true
        schema: {type: string}
        description: Operator id
    post:
      tags: [console]
      summary: Set the platform admin flag
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Delete an operator
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/operators/{operator_id}/projects/{pref}":
    parameters:
      - name: operator_id
        in: path
        required: true
        schema: {type: string}
        description: Operator id
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Grant a project role
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Remove project access
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects":
    get:
      tags: [console]
      summary: Projects this operator can open
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Create a project. Anon and service keys are returned once
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Rename a project
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Delete a project
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/keys":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Rotate the anon and service keys. Plaintext is returned once
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/members":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Project members
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Add a member and set a password
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/users":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Project end users
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/users/{user_id}":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: user_id
        in: path
        required: true
        schema: {type: string}
        description: Project user id
    get:
      tags: [console]
      summary: One project user
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Delete a project user
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/users/{user_id}/password":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: user_id
        in: path
        required: true
        schema: {type: string}
        description: Project user id
    post:
      tags: [console]
      summary: Set a project user's password
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/schemas":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Schemas owned by this project
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/schema":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Tables and columns in one schema
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/tables":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Create a table
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/migrations":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Stored migrations
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Apply a migration
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/migrations/{version}/revert":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: version
        in: path
        required: true
        schema: {type: string}
        description: Migration version
    post:
      tags: [console]
      summary: Revert a revertable migration
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/sql":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Run SQL or store it as a migration. Dangerous SQL returns 409 until confirm is true
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/database/reset":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Rotate the project database role password
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/tables/{table}":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: table
        in: path
        required: true
        schema: {type: string}
        description: Table name
    get:
      tags: [console]
      summary: Paged rows
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Insert a row
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/tables/{table}/rows":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: table
        in: path
        required: true
        schema: {type: string}
        description: Table name
    post:
      tags: [console]
      summary: Update one cell
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Delete a row by primary key
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/objects":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Object keys under the project
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    delete:
      tags: [console]
      summary: Delete an object
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/objects/url":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Signed or public URL for an object
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/objects/upload":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Presign a PUT. The bytes go to that URL without the console bearer
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/buckets":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Buckets
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Create a bucket
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/buckets/{name}":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    patch:
      tags: [console]
      summary: Change whether a bucket is public
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    get:
      tags: [console]
      summary: Function versions
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    post:
      tags: [console]
      summary: Deploy a zip body as application/zip
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}/promote":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    post:
      tags: [console]
      summary: Pin a version
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}/demote":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    post:
      tags: [console]
      summary: Clear the pin
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}/invoke":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    post:
      tags: [console]
      summary: Invoke live or one version
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}/stats":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name
    get:
      tags: [console]
      summary: 24-hour function traffic
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
