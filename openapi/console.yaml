        required: true
        schema: {type: string}
        description: Name
    get:
      tags: [console]
      summary: Function variable names
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
    post:
      tags: [console]
      summary: Set a function variable. The value is never read back
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/env/copy":
    parameters:
      - name: pref
        in: path
        required: true
        schema: {type: string}
        description: Project ref
    post:
      tags: [console]
      summary: Copy sealed variables between the site and one function
      security:
        - consoleBearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Console token required or the second factor was rejected
  "/console/v1/projects/{pref}/functions/{name}/env/{key}":
    parameters:
