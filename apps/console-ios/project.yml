name: Console
options:
  bundleIdPrefix: lab.reactor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGNING_ALLOWED: NO
targets:
  Console:
    type: application
    platform: iOS
    sources:
      - Console
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.reactor.console
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_CFBundleDisplayName: Reactor Console
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    dependencies:
      - package: ConsoleCore
        product: ConsoleCore
packages:
  ConsoleCore:
    path: ConsoleCore
