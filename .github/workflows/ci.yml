name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --exclude reactor-accept
      - name: Docs
        if: hashFiles('v2/websites/docs/package.json') != ''
        working-directory: v2/websites/docs
        run: npm ci && npm run build

  accept:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: aws-actions/setup-sam@v2
      - name: Accept
        run: |
          if [ -f scripts/accept.sh ]; then
            scripts/accept.sh
          else
            v2/scripts/accept.sh
          fi
      - name: Console contract
        run: |
          if [ -f Cargo.toml ]; then ROOT="$PWD"; else ROOT="$PWD/v2"; fi
          mkdir -p "$ROOT/.data"
          (cd "$ROOT" && cargo run -p reactor-accept --bin seed-console)
          set -a
          source "$ROOT/.data/console.env"
          set +a
          docker run --rm --network host \
            -e REACTOR_CONSOLE_URL -e REACTOR_CONSOLE_EMAIL \
            -e REACTOR_CONSOLE_PASSWORD -e REACTOR_CONSOLE_RECOVERY \
            -v "$ROOT/apps/console-ios/ConsoleCore:/src" -w /src swift:6.0 \
            swift test
      - name: JavaScript client
        if: hashFiles('v2/sdks/js/package.json') != ''
        working-directory: v2/sdks/js
        run: |
          if [ -f "$GITHUB_WORKSPACE/v2/.data/sdk.env" ]; then
            set -a; source "$GITHUB_WORKSPACE/v2/.data/sdk.env"; set +a
          else
            set -a; source "$GITHUB_WORKSPACE/.data/sdk.env"; set +a
          fi
          npm ci
          npm test
          npm run test:contract
      - name: Kotlin client
        if: hashFiles('v2/sdks/kotlin/settings.gradle.kts') != ''
        working-directory: v2/sdks/kotlin
        env:
          REACTOR_CLIENT_ONLY: "1"
        run: |
          if [ -f "$GITHUB_WORKSPACE/v2/.data/sdk.env" ]; then
            set -a; source "$GITHUB_WORKSPACE/v2/.data/sdk.env"; set +a
          else
            set -a; source "$GITHUB_WORKSPACE/.data/sdk.env"; set +a
          fi
          chmod +x gradlew
          ./gradlew :reactor-client:test --no-daemon
      - name: Swift client
        if: hashFiles('v2/sdks/swift/Package.swift') != ''
        run: |
          set -a
          source .data/sdk.env
          set +a
          docker run --rm --network host \
            -e REACTOR_URL -e REACTOR_ANON_KEY \
            -v "$PWD/sdks/swift:/src" -w /src swift:6.0 \
            swift test
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Console route spec
        run: |
          if [ -f Cargo.toml ]; then ROOT="$PWD"; else ROOT="$PWD/v2"; fi
          (cd "$ROOT" && cargo test -p reactor-server console_spec_lists_every_route)
      - name: Console core
        run: |
          if [ -f Cargo.toml ]; then ROOT="$PWD"; else ROOT="$PWD/v2"; fi
          docker run --rm \
            -v "$ROOT/apps/console-ios/ConsoleCore:/src" -w /src swift:6.0 \
            swift test
