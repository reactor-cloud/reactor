name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ hashFiles('v2/Cargo.toml') != '' && 'v2' || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --exclude reactor-accept
      - name: Docs
        working-directory: ${{ hashFiles('v2/Cargo.toml') != '' && 'v2/websites/docs' || 'websites/docs' }}
        run: npm ci && npm run build

  accept:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ hashFiles('v2/Cargo.toml') != '' && 'v2' || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: aws-actions/setup-sam@v2
      - name: Accept
        run: scripts/accept.sh
      - name: JavaScript client
        working-directory: ${{ hashFiles('v2/Cargo.toml') != '' && 'v2/sdks/js' || 'sdks/js' }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/v2/.data/sdk.env" ]; then
            set -a; source "$GITHUB_WORKSPACE/v2/.data/sdk.env"; set +a
          else
            set -a; source "$GITHUB_WORKSPACE/.data/sdk.env"; set +a
          fi
          npm ci
          npm test
          npm run test:contract
      - name: Kotlin client
        working-directory: ${{ hashFiles('v2/Cargo.toml') != '' && 'v2/sdks/kotlin' || 'sdks/kotlin' }}
        env:
          REACTOR_CLIENT_ONLY: "1"
        run: |
          if [ -f "$GITHUB_WORKSPACE/v2/.data/sdk.env" ]; then
            set -a; source "$GITHUB_WORKSPACE/v2/.data/sdk.env"; set +a
          else
            set -a; source "$GITHUB_WORKSPACE/.data/sdk.env"; set +a
          fi
          chmod +x gradlew
          ./gradlew :reactor-client:test --no-daemon
      - name: Swift client
        run: |
          set -a
          source .data/sdk.env
          set +a
          docker run --rm --network host \
            -e REACTOR_URL -e REACTOR_ANON_KEY \
            -v "$PWD/sdks/swift:/src" -w /src swift:6.0 \
            swift test
