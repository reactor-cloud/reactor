app = "reactor-v2"
primary_region = "fra"

[build]
  dockerfile = "../../Dockerfile"

[env]
  REACTOR_RUNTIME__MODE = "listen"
  REACTOR_RUNTIME__PLACE = "fly"
  REACTOR_RUNTIME__BASE_DOMAIN = "fly1.reactor.cloud"
  REACTOR_HTTP__BIND = "[::]:8000"
  REACTOR_HTTP__PUBLIC_URL = "https://fly1.reactor.cloud"
  REACTOR_AUTH__PROVIDER = "internal"
  REACTOR_STORAGE__BACKEND = "s3"
  REACTOR_STORAGE__REGION = "auto"
  REACTOR_STORAGE__ENDPOINT = "https://fly.storage.tigris.dev"
  REACTOR_STORAGE__PUBLIC_ENDPOINT = "https://t3.storage.dev"
  REACTOR_FUNCTIONS__RUNTIME = "bun"
  REACTOR_FUNCTIONS__PUBLISHER = "fake"
  REACTOR_FUNCTIONS__WORKDIR = "/tmp/functions"
  REACTOR_FUNCTIONS__BUN = "/usr/local/bin/bun"
  REACTOR_POSTGREST__URL = "http://127.0.0.1:3000"
  REACTOR_SQL_DIR = "/app/sql"
  REACTOR_AGENT__BASE_URL = "https://openrouter.ai/api/v1"
  REACTOR_AGENT__MODEL = "anthropic/claude-sonnet-4.6"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "2m"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
