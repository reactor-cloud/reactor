[workspace]
resolver = "2"
members = [
  "crates/reactor-identity",
  "crates/reactor-auth",
  "crates/reactor-email",
  "crates/reactor-storage",
  "crates/reactor-functions",
  "crates/reactor-sites",
  "crates/reactor-server",
  "crates/reactor-cli",
  "crates/reactor-builder",
  "crates/reactor-accept",
]

[workspace.package]
edition = "2021"
license = "BUSL-1.1"
version = "1.26.9-beta.1"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "fs", "io-util", "sync", "time"] }
axum = { version = "0.8", features = ["multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
argon2 = "0.5"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
zip = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-lambda = "1"
aws-credential-types = "1"
lambda_http = "0.15"
lambda_runtime = "0.14"
subtle = "2"
url = "2"
